name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test Windows workspace
    runs-on: windows-latest
    concurrency:
      group: release-test-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        working-directory: hd2-armor-desk
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hd2-armor-desk -> target

      - name: Run tests
        working-directory: hd2-armor-desk
        shell: pwsh
        run: cargo test --workspace --locked

  build:
    name: Build Windows release
    runs-on: windows-latest
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      built_at: ${{ steps.version.outputs.built_at }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select pinned Rust toolchain
        working-directory: hd2-armor-desk
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: hd2-armor-desk -> target

      - name: Generate UTC+8 version
        id: version
        shell: pwsh
        run: |
          $utc8 = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8))
          $version = $utc8.ToString("yyyyMMdd-HHmmssfff-'UTC8'", [Globalization.CultureInfo]::InvariantCulture)
          $builtAt = $utc8.ToString("yyyy-MM-dd HH:mm:ss.fff zzz", [Globalization.CultureInfo]::InvariantCulture)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=release-$version" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT

      - name: Build release executable
        working-directory: hd2-armor-desk
        shell: pwsh
        env:
          HD2_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: cargo build -p hd2-armor-desk --release --locked

      - name: Package Windows release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILT_AT: ${{ steps.version.outputs.built_at }}
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "hd2-armor-desk\target\release\hd2-armor-desk.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Release executable was not produced: $binary"
          }

          $packageName = "hd2-armor-desk-windows-x64-$env:RELEASE_VERSION"
          $packageDir = Join-Path $env:RUNNER_TEMP $packageName
          $outputDir = Join-Path $env:RUNNER_TEMP "release-output"
          $archive = Join-Path $outputDir "$packageName.zip"
          $checksumFile = "$archive.sha256"

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $imageDir = Join-Path $packageDir "docs\images"
          New-Item -ItemType Directory -Path $imageDir -Force | Out-Null
          Copy-Item -LiteralPath $binary -Destination $packageDir
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "README.md") -Destination $packageDir
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination $packageDir
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "docs\images\armor-desk-overview.png") -Destination $imageDir

          @"
          HD2 Armor Desk
          Version: $env:RELEASE_VERSION
          Built at (UTC+8): $env:BUILT_AT
          Commit: $env:GITHUB_SHA
          Branch: $env:GITHUB_REF_NAME
          "@ | Set-Content -LiteralPath (Join-Path $packageDir "VERSION.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath $checksumFile -Encoding ascii

      - name: Upload packaged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-release
          path: ${{ runner.temp }}/release-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - test
      - build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-release
          path: ${{ runner.temp }}/release-output

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUILT_AT: ${{ needs.build.outputs.built_at }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "release-output"
          $packageName = "hd2-armor-desk-windows-x64-$env:RELEASE_VERSION"
          $archive = Join-Path $releaseDir "$packageName.zip"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Packaged release was not downloaded: $archive"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum was not downloaded: $checksum"
          }

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          此版本由 GitHub Actions 在 $env:GITHUB_REF_NAME 分支提交后自动构建。

          - 版本：$env:RELEASE_VERSION
          - 构建时间（UTC+8）：$env:BUILT_AT
          - 提交：$env:GITHUB_SHA
          - 平台：Windows x64

          下载 ZIP 发布包，并使用同名 .sha256 文件核对完整性。
          "@ | Set-Content -LiteralPath $notesFile -Encoding utf8

          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            $archive, $checksum,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "HD2 Armor Desk $env:RELEASE_VERSION",
            "--notes-file", $notesFile,
            "--latest",
            "--fail-on-no-commits"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed with exit code $LASTEXITCODE"
          }
